server:
  port: 8888
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: mszlu_blog
  datasource:
    url: jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=UTF-8&serverTimeZone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
#      单个文件的最大值
      max-file-size: 2MB
#      上传文件总的最大值
      max-request-size: 20MB
